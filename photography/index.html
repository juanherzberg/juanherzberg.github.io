<style>
:root{--cream:#FBF8F3;--ink:#1C1B19;--muted:#77716A;--line:#E4DED4;--accent:#B5502E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;
  background:radial-gradient(ellipse at 50% 62%,#FFFDF9 0%,#F4EFE6 55%,#E6DFD2 100%)}
a{color:inherit}

.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;pointer-events:none}
.bar>*{pointer-events:auto}
.back{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px}
.mono{width:32px;height:32px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-family:"Fraunces",serif;font-size:13px;flex:none}
.ttl{text-align:right;line-height:1.25}
.ttl b{font-family:"Fraunces",serif;font-weight:400;font-size:20px;display:block;letter-spacing:-.01em}
.ttl span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.head{position:fixed;left:0;right:0;top:11vh;text-align:center;z-index:4;pointer-events:none;transition:opacity .45s,transform .45s}
.head.out{opacity:0;transform:translateY(-14px)}
.head .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.head .tag i{font-family:"Fraunces",serif;font-style:italic;color:var(--accent);letter-spacing:0;font-size:14px;margin-right:4px;text-transform:none}
.head h1{font-family:"Fraunces",serif;font-weight:300;font-size:clamp(38px,6vw,84px);letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.head p{font-size:14px;color:var(--muted);margin-top:8px}

.stage{position:fixed;inset:0;perspective:1900px;perspective-origin:50% 28%;overflow:hidden;cursor:grab;touch-action:none}
.stage.drag{cursor:grabbing}
.rw{position:absolute;left:50%;top:var(--cy,60%);transform-style:preserve-3d;width:0;height:0}
.ring{position:absolute;transform-style:preserve-3d;width:0;height:0}
.card{position:absolute;transform-style:preserve-3d}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;padding:var(--pad,6px);box-shadow:0 18px 36px -18px rgba(30,20,10,.5);cursor:zoom-in}
.card .face img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;background:#EDE7DC}
.card .back{transform:rotateY(180deg)}
.shadow{position:fixed;left:50%;bottom:9vh;width:72vw;height:90px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(60,45,30,.2),transparent 70%);pointer-events:none}

.ui{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;z-index:5}
.list{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:94vw;background:rgba(251,248,243,.7);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px}
.list button{border:0;background:none;font-family:"Fraunces",serif;font-size:17px;color:#A39A8E;padding:6px 11px;cursor:pointer;transition:color .3s}
.list button:hover{color:var(--ink)}
.list button.on{color:var(--ink);font-style:italic}
.hint{position:fixed;left:50%;top:calc(11vh + clamp(38px,6vw,84px) + 74px);transform:translateX(-50%);font-size:12.5px;color:var(--muted);transition:opacity .8s;z-index:5;white-space:nowrap}
.hint.gone{opacity:0}

.lb{position:fixed;inset:0;z-index:100;display:none}
.lb.on{display:block}
.lb .bg{position:absolute;inset:0;background:rgba(24,20,17,0);transition:background .5s}
.lb.open .bg{background:rgba(24,20,17,.9)}
.lb .pic{position:fixed;object-fit:cover;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);transition:all .6s cubic-bezier(.2,.8,.2,1);border:8px solid #fff;cursor:zoom-out;touch-action:none}
.lb .meta{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#EDE6DB;opacity:0;transition:opacity .4s .3s;pointer-events:none}
.lb.open .meta{opacity:1}
.lb .meta b{font-family:"Fraunces",serif;font-weight:400;font-size:20px;display:block}
.lb .meta span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A89F94}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer;opacity:0;transition:opacity .4s .3s}
.lb.open .nav{opacity:1}
.lb .prev{left:24px}.lb .next{right:24px}
.lb .x{position:absolute;top:20px;right:24px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer;opacity:.85}

@media (max-width:760px){
  .bar{padding:12px 14px}
  .back span:not(.mono){display:none}
  .ttl b{font-size:16px}.ttl span{font-size:9.5px}
  .head{top:10vh}.head p{display:none}
  .list button{font-size:14px;padding:5px 7px}
  .list{border-radius:18px}
  .hint{top:calc(10vh + 92px);white-space:normal;width:86vw;text-align:center}
  .lb .nav{display:none}
}
@media (prefers-reduced-motion:reduce){.lb .pic{transition:none}.head{transition:none}}

/* ---------- build ---------- */
function layout(se,k=1){
  const narrow=innerWidth<760;
  const maxPer=narrow?10:14;
  const tiers=Math.ceil(se.n/maxPer), per=Math.ceil(se.n/tiers);
  const avail=innerHeight*(narrow?.44:.46);
  let ch=Math.min(narrow?250:330,avail/(tiers+.16*(tiers-1)));
  const rowsOf=[];for(let t=0;t<tiers;t++)rowsOf.push(se.photos.map((p,k)=>({...p,k})).slice(t*per,t*per+per));
  const gapF=.2;
  const circ=c=>Math.max(...rowsOf.map(r=>r.reduce((a,p)=>a+p.ar*c+gapF*c,0)));
  let R=circ(ch)/(2*Math.PI);
  const Rmax=narrow?innerWidth*.85:Math.min(innerWidth*.42,720);
  const Rmin=narrow?innerWidth*.45:Math.min(innerWidth*.26,380);
  if(R>Rmax){ch*=Rmax/R;R=Rmax}
  if(k!==1){ch*=k;R*=k}
  R=Math.max(R,Rmin*Math.min(1,k));
  return {tiers,rowsOf,ch,R,gy:ch*.16};
}
function buildRing(i,k=1){
  const se=SERIES[i];const L=layout(se,k);
  const rw=document.createElement("div");rw.className="rw";
  const ring=document.createElement("div");ring.className="ring";rw.appendChild(ring);
  const cards=[];
  L.rowsOf.forEach((row,t)=>{
    const y=(t-(L.tiers-1)/2)*(L.ch+L.gy);
    const ws=row.map(p=>p.ar*L.ch);const total=ws.reduce((a,b)=>a+b,0);
    const step=(2*Math.PI*L.R-total)/row.length;
    let acc=(t%2)*(step+ws[0])/2; // brick offset on alternate tiers
    row.forEach((p,j)=>{
      const w=ws[j];const ang=(acc+w/2)/L.R*180/Math.PI;acc+=w+step;
      const c=document.createElement("div");c.className="card";
      Object.assign(c.style,{width:w+"px",height:L.ch+"px",left:-w/2+"px",top:y-L.ch/2+"px",transform:`rotateY(${ang}deg) translateZ(${L.R}px)`});
      c.style.setProperty("--pad",Math.max(3,L.ch*.022)+"px");
      c.innerHTML=`<div class="face" data-k="${p.k}"><img data-src="wall/${p.f}" alt="${se.name}, photograph ${p.k+1}" draggable="false"></div><div class="face back" data-k="${p.k}"><img data-src="wall/${p.f}" alt="" draggable="false"></div>`;
      ring.appendChild(c);cards.push({el:c,ang,faces:$$(".face",c)});
    });
  });
  rw.style.display="none";stage.appendChild(rw);
  return {rw,ring,R:L.R,cards,loaded:false,dy:0};
}
/* fit each ring into the band between the title and the series list */
function band(){
  const hr=$(".hint").getBoundingClientRect();
  const top=Math.max(head.getBoundingClientRect().bottom,hr.height?hr.bottom:0)+(innerWidth<760?22:30);
  const bottom=$(".list").getBoundingClientRect().top-(innerWidth<760?18:26);
  return {top,bottom,h:bottom-top,c:(top+bottom)/2};
}
function measure(rg){
  rg.rw.style.display="";
  rg.rw.style.transform=`translate3d(0,${rg.dy}px,${-rg.R}px) rotateX(${O.tilt}deg)`;
  let t=1e9,b=-1e9;
  for(const c of rg.cards){const r=c.el.getBoundingClientRect();if(r.height){t=Math.min(t,r.top);b=Math.max(b,r.bottom)}}
  rg.rw.style.display="none";
  return {t,b,h:b-t,c:(t+b)/2};
}
function fitRing(i){
  const B=band();let rg=O.rings[i];
  let m=measure(rg);
  if(B.h>40&&m.h>B.h){
    const k=B.h/m.h*.96;rg.rw.remove();rg=buildRing(i,k);O.rings[i]=rg;m=measure(rg);
  }
  for(let n=0;n<2;n++){rg.dy+=B.c-m.c;m=measure(rg)}
}
function build(){
  stage.innerHTML="";O.rings=SERIES.map((_,i)=>buildRing(i));

  SERIES.forEach((_,i)=>{setHeadText(i);fitRing(i)});
  setHeadText(keep);load(keep);
}
function load(i){const r=O.rings[i];if(r.loaded)return;r.loaded=true;$$("img[data-src]",r.rw).forEach(im=>{im.src=im.dataset.src})}

const head=$(".head");

function setHead(i,anim){
  const se=SERIES[i];

    if(!O.drag){O.v+=(BASE_V-O.v)*.03;O.a+=O.v}
    const sw=O.switching;let p=1;
    if(sw){p=Math.min(1,(now-sw.t0)/(reduce?1:1100));if(p>=1)O.switching=null}
    const e=ease(p);
    O.rings.forEach((rg,j)=>{
      let y,f,z=0,rx=O.tilt;
      if(sw&&j===sw.from){y=-e*innerHeight*1.1*sw.dir;f=1-e;z=-e*700;rx=O.tilt-e*25*sw.dir}
      else if(sw&&j===sw.to){y=(1-e)*innerHeight*1.1*sw.dir;f=e;z=-(1-e)*700;rx=O.tilt+(1-e)*25*sw.dir}
      else if(j===O.i){y=0;f=1}
      else{if(rg.rw.style.display!=="none")rg.rw.style.display="none";return}
      rg.rw.style.display="";
      rg.rw.style.transform=`translate3d(0,${y+rg.dy}px,${z-rg.R}px) rotateX(${rx}deg)`;
      rg.ring.style.transform=`rotateY(${O.a}deg)`;
      for(const c of rg.cards){
        const d=(Math.cos((c.ang+O.a)*Math.PI/180)+1)/2;
        const op=((.22+.78*d)*f).toFixed(3);
        c.faces[0].style.opacity=op;c.faces[1].style.opacity=(op*.75).toFixed(3);
      }
    });
  }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const degPerPx=()=>180/(Math.PI*O.rings[O.i].R);
stage.addEventListener("pointerdown",e=>{O.drag={x:e.clientX,y:e.clientY,lx:e.clientX,a:O.a,t0:O.tilt,moved:false};stage.setPointerCapture(e.pointerId)});
stage.addEventListener("pointermove",e=>{
  if(!O.drag)return;const dx=e.clientX-O.drag.x,dy=e.clientY-O.drag.y;
  if(!O.drag.moved&&Math.hypot(dx,dy)>6){O.drag.moved=true;stage.classList.add("drag");hideHint()}
  if(O.drag.moved){O.v=(e.clientX-O.drag.lx)*degPerPx();O.drag.lx=e.clientX;O.a=O.drag.a+dx*degPerPx();
    O.tilt=Math.max(-14,Math.min(-4,O.drag.t0+dy*.03))}
});
stage.addEventListener("pointerup",e=>{
  if(!O.drag)return;stage.classList.remove("drag");
  if(!O.drag.moved){const el=document.elementFromPoint(e.clientX,e.clientY);const f=el&&el.closest(".face");
    if(f){hideHint();openLB(O.i,+f.dataset.k,f)}}
  O.drag=null;
});
stage.addEventListener("pointercancel",()=>{O.drag=null;stage.classList.remove("drag")});
addEventListener("wheel",e=>{if(lbState)return;O.v+=(e.deltaY+e.deltaX)*-.0035;hideHint()},{passive:true});
addEventListener("keydown",e=>{
  if(lbState){if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")stepLB(1);if(e.key==="ArrowLeft")stepLB(-1);return}
  if(e.key==="ArrowDown"){e.preventDefault();switchRing(O.i+1)}
  if(e.key==="ArrowUp"){e.preventDefault();switchRing(O.i-1)}
  if(e.key==="ArrowRight")O.v-=1.2;
  if(e.key==="ArrowLeft")O.v+=1.2;
});

/* ---------- lightbox ---------- */
const lb=$(".lb"), lbImg=$(".pic",lb);
let lbState=null;
function targetRect(ar){
  const mw=innerWidth*(innerWidth<760?.92:.8), mh=innerHeight*.74;
  let w=mw,h=w/ar; if(h>mh){h=mh;w=h*ar}
  return {left:(innerWidth-w)/2,top:(innerHeight-h)/2-20,width:w,height:h};
}
function place(r){Object.assign(lbImg.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"})}
function showHi(si,k){const p=SERIES[si].photos[k];const hi=new Image();hi.onload=()=>{if(lbState&&lbState.si===si&&lbState.k===k)lbImg.src=hi.src};hi.src="full/"+p.f}
function openLB(si,k,fromEl){
  lbState={si,k};const p=SERIES[si].photos[k];
  lbImg.src="wall/"+p.f;showHi(si,k);
  lbImg.style.transition="none";
  place(fromEl.getBoundingClientRect());lbImg.style.opacity=1;
  lb.classList.add("on");lb.setAttribute("aria-hidden","false");
  lbImg.offsetWidth;lbImg.style.transition="";
  requestAnimationFrame(()=>{lb.classList.add("open");place(targetRect(p.ar))});
  meta();
}
function meta(){const s=SERIES[lbState.si];$(".meta b",lb).textContent=s.name;$(".meta span",lb).textContent=`${lbState.k+1} / ${s.n}`}
function stepLB(d){
  const s=SERIES[lbState.si];lbState.k=(lbState.k+d+s.n)%s.n;const {si,k}=lbState;const p=s.photos[k];
  lbImg.style.opacity=0;
  setTimeout(()=>{lbImg.style.transition="none";lbImg.src="wall/"+p.f;showHi(si,k);place(targetRect(p.ar));lbImg.offsetWidth;lbImg.style.transition="";lbImg.style.opacity=1;meta()},reduce?0:200);
}
function closeLB(){
  if(!lbState)return;lb.classList.remove("open");lbImg.style.opacity=0;lbState=null;
  setTimeout(()=>{lb.classList.remove("on");lb.setAttribute("aria-hidden","true")},reduce?0:450);
}
$(".bg",lb).onclick=closeLB;$(".x",lb).onclick=closeLB;
$(".prev",lb).onclick=()=>stepLB(-1);$(".next",lb).onclick=()=>stepLB(1);
let sw=null;
lbImg.addEventListener("pointerdown",e=>{sw={x:e.clientX}});
lbImg.addEventListener("pointerup",e=>{if(!sw)return;const dx=e.clientX-sw.x;sw=null;if(Math.abs(dx)>40)stepLB(dx<0?1:-1);else closeLB()});
lbImg.addEventListener("dragstart",e=>e.preventDefault());

/* ---------- start ---------- */
if(matchMedia("(pointer: coarse)").matches)$(".hint").textContent="Swipe to spin · tap a photo · pick a series below";
{const h=location.hash.slice(1);const i=SERIES.findIndex(s=>s.slug===h);if(i>0)O.i=i}
function placeCenter(){document.documentElement.style.setProperty("--cy",(innerWidth<760?55:58)+"%")}
placeCenter();setHead(O.i,false);build();requestAnimationFrame(frame);
setTimeout(()=>{if(O.i+1<N)load(O.i+1)},2500);
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{placeCenter();build();O.rings.forEach((r,j)=>{if(j===O.i)load(j)})},200)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{build();O.rings.forEach((r,j)=>{if(j===O.i)load(j)})});

</script>
</body>
</html>
